      type: string
      description: 결제 성공은 ORDER_PLACED입니다. 실물 검수 완료 및 필요한 변경안의 고객 승인 전에는 IN_PRODUCTION으로 전환할 수 없습니다.
      enum:
      - PENDING_PAYMENT
      - ORDER_PLACED
      - PICKUP_SCHEDULED
      - PICKUP_IN_PROGRESS
      - PRODUCT_RECEIVED
      - EXPERT_INSPECTION
      - PRODUCTION_READY
      - CHANGE_APPROVAL_REQUIRED
      - IN_PRODUCTION
      - QUALITY_CHECK
      - SHIPPED
      - DELIVERED
      - COMPLETED
      - PRODUCTION_UNAVAILABLE
      - CANCELED
    ApplicationExceptionStatus:
      type: string
      enum:
      - PRODUCTION_UNAVAILABLE
      - CANCELED
    LifecycleCommandTargetStatus:
      type: string
      description: 운영자 상태 진행 명령이 직접 만들 수 있는 상태입니다. PRODUCTION_UNAVAILABLE은 제작 중 또는 품질 검수 중에만, CANCELED는 PRODUCTION_UNAVAILABLE에서만 허용됩니다.
      enum:
      - PICKUP_SCHEDULED
      - PICKUP_IN_PROGRESS
      - PRODUCT_RECEIVED
      - EXPERT_INSPECTION
      - IN_PRODUCTION
      - QUALITY_CHECK
      - SHIPPED
      - DELIVERED
      - COMPLETED
      - PRODUCTION_UNAVAILABLE
      - CANCELED
    ApplicationLifecycleCommandRequest:
      type: object
      additionalProperties: false
      required:
      - targetStatus
      properties:
        targetStatus:
          $ref: '#/components/schemas/LifecycleCommandTargetStatus'
        note:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
        trackingNumber:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '\S'
        carrierCode:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '\S'
          default: MCM_REBORN_DEMO
        carrierName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
          default: MCM RE:BORN Demo Logistics
      allOf:
      - if:
          properties:
            targetStatus:
              const: SHIPPED
          required:
          - targetStatus
        then:
          required:
          - trackingNumber
        else:
          not:
            anyOf:
            - required:
              - trackingNumber
            - required:
              - carrierCode
            - required:
              - carrierName
