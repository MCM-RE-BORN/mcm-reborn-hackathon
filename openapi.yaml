openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: MCM RE:BORN Service Demo API
  version: 2.0.0
  description: 'MCM RE:BORN 시연형 MVP API의 breaking v2 계약입니다.

    실제 MCM 내부 시스템, PG, 택배, 정품 인증 또는 공인 ESG 산식과 연동하지 않습니다.

    분석은 LIVE, SEEDED_ESTIMATE 또는 DEMO_FIXTURE 모드로 동일한 예상값 계약을 제공합니다.

    모든 AI 결과는 사진 기반 예상치로 표시하며, 최종 판단은 주문 후 전문가 실물 검수에서 수행합니다.

    '
servers:
- url: /api/v2
  description: Same-origin Next.js Route Handlers
- url: http://localhost:3000/api/v2
  description: Local development
security:
- bearerAuth: []
tags:
- name: System
- name: Auth
- name: Uploads
- name: Analyses
- name: Products
- name: Applications
- name: Operator
- name: Certificates
- name: Analytics
paths:
  /health:
    get:
      tags:
      - System
      operationId: getHealth
      summary: API 상태 확인
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: 2.0.0
                timestamp: '2026-08-17T06:30:00Z'
                aiMode: DEMO_FIXTURE
  /auth/demo-login:
    post:
      tags:
      - Auth
      operationId: demoLogin
      summary: 해커톤 데모 계정 로그인
      description: ENABLE_DEMO_LOGIN=true 환경에서만 활성화합니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
            examples:
              customer:
                value:
                  demoAccount: CUSTOMER
              operator:
                value:
                  demoAccount: OPERATOR
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoLoginResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me:
    get:
      tags:
      - Auth
      operationId: getCurrentUser
      summary: 현재 로그인 사용자 조회
      responses:
        '200':
          description: 현재 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /uploads/presign:
    post:
      tags:
      - Uploads
      operationId: createUploadUrls
      summary: 원제품 이미지 업로드 URL 발급
      description: 고객 전용. JPG 또는 PNG를 파일당 10MB까지 허용합니다. URL은 점진 업로드를 위해 한 번에 1~4개 발급할 수 있습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignUploadRequest'
      responses:
        '201':
          description: 업로드 URL 발급
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /analyses:
    post:
      tags:
      - Analyses
      operationId: createAnalysis
      summary: 원제품 이미지 분석 실행
      description: 'OpenAI Responses API와 Structured Output을 사용합니다.

        LIVE 제공자 오류 시 준비된 DEMO_FIXTURE 결과를 동일한 예상값 계약으로 반환할 수 있습니다.

        분석 입력은 정면, 후면, 상단, 하단, 좌측면, 우측면, 일련번호 순서의 서로 다른 사진 7장입니다.

        이미지 품질이 분석에 충분하지 않으면 성공 분석을 생성하지 않고 IMAGE_QUALITY_INSUFFICIENT 오류와 재촬영 안내를 반환합니다.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalysisRequest'
      responses:
        '201':
          description: 분석 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
              examples:
                live:
                  $ref: '#/components/examples/AnalysisLiveExample'
                fallback:
                  $ref: '#/components/examples/AnalysisFallbackExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ImageQualityInsufficient'
        '502':
          description: AI 제공자 오류. LIVE 모드에서 폴백을 사용하지 않을 때만 반환할 수 있습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: AI 제공자 시간 초과. LIVE 모드에서 폴백을 사용하지 않을 때만 반환할 수 있습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Analyses
      operationId: listMyAnalyses
      summary: 내 분석 목록 조회
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 분석 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAnalyses'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /analyses/{analysisId}:
    parameters:
    - $ref: '#/components/parameters/AnalysisId'
    get:
      tags:
      - Analyses
      operationId: getAnalysis
      summary: 분석 결과 조회
      responses:
        '200':
          description: 분석 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /products:
    get:
      tags:
      - Products
      operationId: listProducts
      summary: 추천 제품 목록 조회
      description: 제품 목록은 모든 제품의 완성형 정적 이미지를 반환하고 3D 렌더링은 상세에서 수행합니다.
      parameters:
      - name: analysisId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 추천 점수 순 제품 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProductCards'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /products/{productId}:
    parameters:
    - $ref: '#/components/parameters/ProductId'
    get:
      tags:
      - Products
      operationId: getProduct
      summary: 제품 및 3D 상세 조회
      description: 모든 활성 제품은 model3d 객체를 반드시 반환합니다.
      parameters:
      - name: analysisId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 제품 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications:
    post:
      tags:
      - Applications
      operationId: createApplication
      summary: 업사이클링 신청 생성
      description: '사진 기반 사전 확인이 ORDER_ELIGIBLE인 분석으로 주문을 생성합니다.

        사전 확인은 공식 정품 확정이 아니며, 최종 제작 가능 여부와 조건은 주문·수거 후 전문가 실물 검수에서 결정합니다.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
            example:
              analysisId: 20000000-0000-4000-8000-000000000001
              productId: 10000000-0000-4000-8000-000000000001
              selectedOptions:
                edgeColor: COGNAC
                initials: MCM
              shippingAddress:
                recipientName: 김민지
                phone: 010-1234-5678
                postalCode: '04524'
                address1: 서울시 중구 퇴계로 24
                address2: 101동 1203호
              pickupSchedule:
                requestedDate: '2026-08-19'
                timeWindow: '14:00-16:00'
              consents:
                serviceAndPrivacyTermsAccepted: true
                aiEstimateNoticeAccepted: true
                inspectionChangeNoticeAccepted: true
      responses:
        '201':
          description: 신청 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags:
      - Applications
      operationId: listMyApplications
      summary: 내 신청 목록 조회
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ApplicationStatus'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 신청 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedApplications'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /applications/{applicationId}:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags:
      - Applications
      operationId: getApplication
      summary: 신청 상세 조회
      description: persistedStatus와 mock 계산을 결합한 effectiveStatus를 반환합니다.
      responses:
        '200':
          description: 신청 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications/{applicationId}/mock-payment:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    post:
      tags:
      - Applications
      operationId: completeMockPayment
      summary: Mock 결제 완료
      description: SUCCESS이면 주문을 ORDER_PLACED로 전환합니다. FAILURE이면 PENDING_PAYMENT를 유지합니다.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockPaymentRequest'
      responses:
        '200':
          description: 결제 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockPaymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /applications/{applicationId}/timeline:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags:
      - Applications
      operationId: getApplicationTimeline
      summary: 신청 공정 타임라인 조회
      responses:
        '200':
          description: 계산된 공정 타임라인
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationTimeline'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications/{applicationId}/shipment:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags:
      - Applications
      operationId: getMockShipment
      summary: Mock 물류 조회
      responses:
        '200':
          description: Mock 운송장과 배송 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockShipment'
              example:
                applicationId: 30000000-0000-4000-8000-000000000001
                carrierCode: MCM_REBORN_DEMO
                carrierName: MCM RE:BORN Demo Logistics
                trackingNumber: DEMO-RB-20260817-0001
                trackingUrl: null
                status: DELIVERED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications/{applicationId}/certificate:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags:
      - Certificates
      operationId: getCertificateByApplication
      summary: 신청의 ESG 보증서 조회
      responses:
        '200':
          description: 보증서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsgCertificate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 신청이 완료되지 않아 보증서가 준비되지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /certificates/{certificateId}/verify:
    parameters:
    - $ref: '#/components/parameters/CertificateId'
    get:
      tags:
      - Certificates
      operationId: verifyCertificate
      summary: 공개 보증서 검증 데이터 조회
      security: []
      responses:
        '200':
          description: 검증 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateVerification'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/applications:
    get:
      tags:
      - Operator
      operationId: listApplicationsForOperator
      summary: 운영자 신청 목록 조회
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ApplicationStatus'
      - name: query
        in: query
        description: 신청번호 또는 고객 표시명 검색
        schema:
          type: string
          maxLength: 80
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 운영자 신청 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedOperatorApplications'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/applications/{applicationId}:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags:
      - Operator
      operationId: getApplicationForOperator
      summary: 운영자 신청 상세 조회
      responses:
        '200':
          description: 운영자 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorApplicationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/applications/{applicationId}/lifecycle-commands:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    post:
      tags:
      - Operator
      operationId: advanceApplicationLifecycle
      x-required-role: OPERATOR
      summary: 주문 수거·제작·품질·배송 상태 진행
      description: '운영자 전용 명령입니다. 현재 상태에서 허용된 바로 다음 상태로만 진행하며 상태를 건너뛰거나 되돌릴 수 없습니다.

        정상 진행 target은 PICKUP_SCHEDULED, PICKUP_IN_PROGRESS, PRODUCT_RECEIVED, EXPERT_INSPECTION, IN_PRODUCTION, QUALITY_CHECK, SHIPPED, DELIVERED, COMPLETED입니다.

        PRODUCTION_UNAVAILABLE은 IN_PRODUCTION 또는 QUALITY_CHECK에서 공정 중 제작 불가를 기록할 때만 허용합니다. EXPERT_INSPECTION 단계의 제작 불가는 실물 검수 API의 outcome으로 기록합니다. CANCELED는 현재 상태가 PRODUCTION_UNAVAILABLE일 때 Mock 결제 취소·환불 처리를 마무리하는 경우에만 허용합니다. PRODUCTION_READY와 CHANGE_APPROVAL_REQUIRED는 실물 검수 또는 고객 변경안 결정 API에서만 만들 수 있습니다.

        같은 Idempotency-Key와 같은 정규화 요청의 재시도는 최초 처리 결과를 반환해야 합니다. 같은 키를 다른 요청에 재사용하거나 전이 guard 위반, 순서 건너뛰기, 되돌리기, 허용되지 않은 예외 상태를 요청하면 409입니다.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationLifecycleCommandRequest'
            example:
              targetStatus: SHIPPED
              note: 최종 품질 검수를 통과해 배송을 시작합니다.
              trackingNumber: DEMO-RB-20260817-0001
              carrierCode: MCM_REBORN_DEMO
              carrierName: MCM RE:BORN Demo Logistics
      responses:
        '200':
          description: 상태 진행 완료 또는 동일 멱등 요청의 기존 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationLifecycleCommandResponse'
              example:
                applicationId: 30000000-0000-4000-8000-000000000001
                previousStatus: QUALITY_CHECK
                applicationStatus: SHIPPED
                occurredAt: '2026-09-17T01:00:00Z'
                shipment:
                  applicationId: 30000000-0000-4000-8000-000000000001
                  carrierCode: MCM_REBORN_DEMO
                  carrierName: MCM RE:BORN Demo Logistics
                  trackingNumber: DEMO-RB-20260817-0001
                  trackingUrl: null
                  status: SHIPPED
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/applications/{applicationId}/inspection:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    post:
      tags:
      - Operator
      operationId: submitPhysicalInspection
      x-required-role: OPERATOR
      summary: 주문 후 전문가 실물 검수 제출
      description: 'PRODUCT_RECEIVED 또는 EXPERT_INSPECTION 상태에서만 수행합니다. 조건 변경이 없으면 PRODUCTION_READY, 변경이 있으면 CHANGE_APPROVAL_REQUIRED, 제작 불가이면 PRODUCTION_UNAVAILABLE로 전환합니다.

        CHANGE_REQUIRED 요청은 proposedTerms가 필수입니다. 서버는 실물 검수, 연결된 PENDING 변경안, 주문 상태와 상태 이력을 하나의 트랜잭션으로 커밋해야 하며 일부만 저장해서는 안 됩니다.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitPhysicalInspectionRequest'
      responses:
        '200':
          description: 실물 검수 원자 처리 완료. CHANGE_REQUIRED이면 생성된 changeRequest를 함께 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalInspectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /applications/{applicationId}/change-request:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags:
      - Applications
      operationId: getApplicationChangeRequest
      summary: 실물 검수 후 변경 조건 조회
      responses:
        '200':
          description: 고객 승인 대기 또는 처리된 변경 조건
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationChangeRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications/{applicationId}/change-request/approve:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    post:
      tags:
      - Applications
      operationId: approveApplicationChangeRequest
      summary: 변경 조건 고객 승인
      description: CHANGE_APPROVAL_REQUIRED 상태의 변경안을 승인하고 주문을 PRODUCTION_READY로 전환합니다.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 변경 조건 승인 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationChangeDecisionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /applications/{applicationId}/change-request/reject:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    post:
      tags:
      - Applications
      operationId: rejectApplicationChangeRequest
      summary: 변경 조건 고객 거절 및 주문 취소
      description: 변경안을 거절하고 주문을 CANCELED로 전환합니다. 고객 승인 없이 제작을 시작하지 않습니다.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectApplicationChangeRequest'
      responses:
        '200':
          description: 변경 조건 거절 및 취소 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationChangeDecisionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /events:
    post:
      tags:
      - Analytics
      operationId: trackEvent
      summary: KPI 이벤트 기록
      security:
      - bearerAuth: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackEventRequest'
      responses:
        '202':
          description: 이벤트 접수
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - accepted
                - eventId
                properties:
                  accepted:
                    type: boolean
                    const: true
                  eventId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
