openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: MCM RE:BORN Hackathon API
  version: 1.1.0
  description: '2주 해커톤용 MCM RE:BORN API 계약입니다.

    실제 MCM 내부 시스템, PG, 택배, 정품 인증 또는 공인 ESG 산식과 연동하지 않습니다.

    OpenAI 이미지 분석은 실제 API를 사용하되 hybrid 모드에서 Fixture로 폴백할 수 있습니다.

    사진 품질 미달은 재촬영 오류로 반환하고, 정품 관련 신호는 수동 검토 게이트로만 사용합니다.

    '
servers:
- url: /api/v1
  description: Same-origin Next.js Route Handlers
- url: http://localhost:3000/api/v1
  description: Local development
security:
- bearerAuth: []
tags:
- name: System
- name: Auth
- name: Uploads
- name: Analyses
- name: Products
- name: Applications
- name: Operator
- name: Certificates
- name: Analytics
paths:
  /health:
    get:
      tags:
      - System
      operationId: getHealth
      summary: API 상태 확인
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: 1.0.0
                timestamp: '2026-08-04T06:30:00Z'
                aiMode: hybrid
  /auth/demo-login:
    post:
      tags:
      - Auth
      operationId: demoLogin
      summary: 해커톤 데모 계정 로그인
      description: ENABLE_DEMO_LOGIN=true 환경에서만 활성화합니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
            examples:
              customer:
                value:
                  demoAccount: CUSTOMER
              operator:
                value:
                  demoAccount: OPERATOR
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoLoginResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me:
    get:
      tags:
      - Auth
      operationId: getCurrentUser
      summary: 현재 로그인 사용자 조회
      responses:
        '200':
          description: 현재 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /uploads/presign:
    post:
      tags:
      - Uploads
      operationId: createUploadUrls
      summary: 원제품 이미지 업로드 URL 발급
      description: 고객 전용. JPEG, PNG, WebP를 파일당 6MB까지 허용합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignUploadRequest'
      responses:
        '201':
          description: 업로드 URL 발급
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /analyses:
    post:
      tags:
      - Analyses
      operationId: createAnalysis
      summary: 원제품 이미지 분석 실행
      description: 'OpenAI Responses API와 Structured Output을 사용합니다.

        AI_MODE=hybrid에서는 제공자 오류 시 Fixture 결과를 성공 응답으로 반환합니다.

        이미지 품질이 분석에 충분하지 않으면 성공 분석을 생성하지 않고 IMAGE_QUALITY_INSUFFICIENT 오류와 재촬영 안내를 반환합니다.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalysisRequest'
      responses:
        '201':
          description: 분석 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
              examples:
                live:
                  $ref: '#/components/examples/AnalysisLiveExample'
                fallback:
                  $ref: '#/components/examples/AnalysisFallbackExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ImageQualityInsufficient'
        '502':
          description: AI 제공자 오류. AI_MODE=live일 때만 반환할 수 있습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: AI 제공자 시간 초과. AI_MODE=live일 때만 반환할 수 있습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Analyses
      operationId: listMyAnalyses
      summary: 내 분석 목록 조회
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 분석 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAnalyses'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /analyses/{analysisId}:
    parameters:
    - $ref: '#/components/parameters/AnalysisId'
    get:
      tags:
      - Analyses
      operationId: getAnalysis
      summary: 분석 결과 조회
      responses:
        '200':
          description: 분석 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /products:
    get:
      tags:
      - Products
      operationId: listProducts
      summary: 추천 제품 목록 조회
      description: 제품 목록은 모든 제품의 완성형 정적 이미지를 반환하고 3D 렌더링은 상세에서 수행합니다.
      parameters:
      - name: analysisId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 추천 점수 순 제품 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProductCards'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /products/{productId}:
    parameters:
    - $ref: '#/components/parameters/ProductId'
    get:
      tags:
      - Products
      operationId: getProduct
      summary: 제품 및 3D 상세 조회
      description: 모든 활성 제품은 model3d 객체를 반드시 반환합니다.
      parameters:
      - name: analysisId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 제품 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications:
    post:
      tags:
      - Applications
      operationId: createApplication
      summary: 업사이클링 신청 생성
      description: '분석의 authenticitySignal이 NOT_EVALUATED일 때만 신청을 생성합니다.

        REVIEW_REQUIRED이면 신청을 생성하지 않고 수동 검토 대기 상태와 함께 AUTHENTICITY_REVIEW_REQUIRED 오류를 반환합니다.

        이 신호는 정품 또는 가품 판정이 아닙니다.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: 신청 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/AuthenticityReviewRequired'
    get:
      tags:
      - Applications
      operationId: listMyApplications
      summary: 내 신청 목록 조회
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ApplicationStatus'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 신청 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedApplications'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /applications/{applicationId}:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags:
      - Applications
      operationId: getApplication
      summary: 신청 상세 조회
      description: persistedStatus와 mock 계산을 결합한 effectiveStatus를 반환합니다.
      responses:
        '200':
          description: 신청 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications/{applicationId}/mock-payment:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    post:
      tags:
      - Applications
      operationId: completeMockPayment
      summary: Mock 결제 완료
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockPaymentRequest'
      responses:
        '200':
          description: 결제 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockPaymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /applications/{applicationId}/timeline:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags:
      - Applications
      operationId: getApplicationTimeline
      summary: 신청 공정 타임라인 조회
      responses:
        '200':
          description: 계산된 공정 타임라인
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationTimeline'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications/{applicationId}/shipment:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags:
      - Applications
      operationId: getMockShipment
      summary: Mock 물류 조회
      responses:
        '200':
          description: Mock 운송장과 배송 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockShipment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications/{applicationId}/certificate:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags:
      - Certificates
      operationId: getCertificateByApplication
      summary: 신청의 ESG 보증서 조회
      responses:
        '200':
          description: 보증서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsgCertificate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 신청이 완료되지 않아 보증서가 준비되지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /certificates/{certificateId}/verify:
    parameters:
    - $ref: '#/components/parameters/CertificateId'
    get:
      tags:
      - Certificates
      operationId: verifyCertificate
      summary: 공개 보증서 검증 데이터 조회
      security: []
      responses:
        '200':
          description: 검증 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateVerification'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/applications:
    get:
      tags:
      - Operator
      operationId: listApplicationsForOperator
      summary: 운영자 신청 목록 조회
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ApplicationStatus'
      - name: query
        in: query
        description: 신청번호 또는 고객 표시명 검색
        schema:
          type: string
          maxLength: 80
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 운영자 신청 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedOperatorApplications'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/applications/{applicationId}:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags:
      - Operator
      operationId: getApplicationForOperator
      summary: 운영자 신청 상세 조회
      responses:
        '200':
          description: 운영자 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorApplicationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/applications/{applicationId}/approve:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    post:
      tags:
      - Operator
      operationId: approveApplication
      summary: 신청 승인
      description: PENDING_APPROVAL 상태에서만 가능하며 이후 공정은 자동 Mock 시뮬레이션합니다.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveApplicationRequest'
      responses:
        '200':
          description: 승인 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationApprovalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /events:
    post:
      tags:
      - Analytics
      operationId: trackEvent
      summary: KPI 이벤트 기록
      security:
      - bearerAuth: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackEventRequest'
      responses:
        '202':
          description: 이벤트 접수
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - accepted
                - eventId
                properties:
                  accepted:
                    type: boolean
                    const: true
                  eventId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: 생성, 결제, 승인 중복 방지 키
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CertificateId:
      name: certificateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 인증 필요
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 상태 충돌 또는 중복 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ImageQualityInsufficient:
      description: 이미지 품질이 분석에 충분하지 않아 재촬영이 필요함
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImageQualityInsufficientErrorResponse'
          example:
            error:
              code: IMAGE_QUALITY_INSUFFICIENT
              message: 이미지 품질이 분석 기준을 충족하지 않습니다. 안내에 따라 다시 촬영해 주세요.
              requestId: req_analysis_recapture_001
              details:
                imageQuality:
                  status: RECAPTURE_REQUIRED
                  issues:
                  - assetId: 90000000-0000-4000-8000-000000000004
                    code: BLUR
                    guidanceKo: 카메라를 고정하고 제품에 초점을 맞춘 뒤 다시 촬영해 주세요.
                  - assetId: 90000000-0000-4000-8000-000000000004
                    code: TOO_DARK
                    guidanceKo: 밝고 균일한 조명 아래에서 제품 전체가 보이도록 촬영해 주세요.
                retryable: true
    AuthenticityReviewRequired:
      description: 정품 여부를 판정하지 않으며 수동 검토가 필요해 신청 생성을 차단함
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticityReviewRequiredErrorResponse'
          example:
            error:
              code: AUTHENTICITY_REVIEW_REQUIRED
              message: 정품 여부 판정 없이 운영자 수동 검토가 필요합니다. 검토가 끝날 때까지 신청을 생성할 수 없습니다.
              requestId: req_application_review_001
              details:
                analysisId: 20000000-0000-4000-8000-000000000003
                authenticitySignal: REVIEW_REQUIRED
                applicationCreationBlocked: true
                manualReviewCaseId: 25000000-0000-4000-8000-000000000001
                manualReviewStatus: PENDING
                nextAction: AWAIT_MANUAL_REVIEW
  examples:
    AnalysisLiveExample:
      value:
        id: 71d65a99-14bc-48b6-a58f-85043110aff1
        status: COMPLETED
        modeUsed: LIVE
        sourceProduct:
          category: TOTE_SHOPPER
          materialType: COATED_CANVAS
          confidence: 0.89
        condition:
          grade: B
          overallDamageSeverity: 31
          summary: 몸판은 대체로 양호하고 손잡이와 모서리에 마모가 있습니다.
        damages:
        - type: HANDLE_WEAR
          location: TOP_HANDLE
          severity: 54
          confidence: 0.92
        imageQuality:
          status: ACCEPTABLE
          issues: []
        authenticitySignal: NOT_EVALUATED
        reusableMaterialRate: 65
        estimatedReusableAreaCm2: 2470
        longStripAvailable: false
        recommendations:
        - productId: 10000000-0000-4000-8000-000000000001
          productCode: REBORN_POUCH
          eligible: true
          score: 96
          reasonCodes:
          - SUFFICIENT_AREA
          - PATTERN_VISIBILITY
        esgPreview:
          methodologyVersion: DEMO_LCA_V1
          estimatedCarbonSavingKgCo2e: 2.96
          disclaimer: 해커톤용 추정치이며 공인 ESG 수치가 아닙니다.
        provider:
          name: OPENAI
          model: gpt-5.6
          requestId: resp_demo_live
        warnings: []
        createdAt: '2026-08-04T06:30:00Z'
        completedAt: '2026-08-04T06:30:08Z'
